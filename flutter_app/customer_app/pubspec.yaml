name: customer_app
description: "Ullur Mechanic - On-demand vehicle breakdown repair and wholesale parts super-app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.4
  google_fonts: ^6.2.1
  http: ^1.2.1
  socket_io_client: ^2.0.3+1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  geolocator: ^12.0.0
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.3
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
